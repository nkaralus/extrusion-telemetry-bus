[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extrusion-telemetry-bus"
version = "0.1.0"
description = "Local-first fabrication & remnant inventory bus for aluminum extrusion shops"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.5",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
extbus = "extrusion_bus.cli:main"

[tool.setuptools.packages.find]
include = ["extrusion_bus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
