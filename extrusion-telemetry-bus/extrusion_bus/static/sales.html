<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Field Intake</title><link rel="stylesheet" href="/static/app.css">
</head><body>
<div class="bar"><h1>Field Intake</h1><input id="job" aria-label="Job ID" autocomplete="off"><input id="cust" aria-label="Customer name" placeholder="Customer name" autocomplete="off"><span id="pill" class="pill warn">...</span></div>
<main class="wrap">
  <section><h2>1 · Photos</h2><div id="photos" class="grid g3"></div></section>
  <section><h2>2 · Measurements (inches)</h2>
    <div class="grid g2">
      <label class="field"><span>Total width</span><input type="text" id="width_in" data-key="width_in" inputmode="text" placeholder="e.g. 156"></label>
      <label class="field"><span>Projection</span><input type="text" id="proj_in" data-key="proj_in" inputmode="text" placeholder="e.g. 144"></label>
      <label class="field"><span>House attachment height</span><input type="text" id="house_h_in" data-key="house_h_in" inputmode="text" placeholder="e.g. 120"></label>
      <label class="field"><span>Desired front height</span><input type="text" id="front_h_in" data-key="front_h_in" inputmode="text" placeholder="e.g. 96"></label>
    </div>
    <p class="muted" id="pitchline"></p>
  </section>
  <section><h2>3 · To do before this can go to Engineering</h2><div id="cards"></div></section>
  <section><h2>4 · Price</h2><div id="quote"></div></section>
</main>
<script src="/static/common.js"></script>
<script>
const { $, $$, h, api, money, toast, guard, debounce } = X;
const SLOTS = [
  { kind: 'wide_context', title: '1 · Wide context', hint: 'Whole patio, house wall and yard edge' },
  { kind: 'tie_in_closeup', title: '2 · Roof tie-in', hint: 'Close-up of the eave or wall where the roof attaches' },
  { kind: 'sketch', title: '3 · Tape sketch', hint: 'Your sketch with measurements, photographed flat' },
];
const NICE = { yes: 'Yes', no: 'No', acknowledged: 'Got it', fascia: 'Fascia', brick: 'Brick', soffit_overhang: 'Soffit / overhang',
  concrete_block: 'Concrete block', siding_vinyl: 'Vinyl siding', siding_wood: 'Wood siding' };
let jobId = '', detail = null, quoteSeq = 0;

function newJobId() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `JOB-${String(d.getFullYear()).slice(2)}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
async function load() {
  detail = await api('/api/sales/jobs/' + encodeURIComponent(jobId) + '?create=1');
  render();
}
async function answer(key, value) {
  await guard(async () => { await api('/api/sales/intake/answer', { method: 'POST', body: { job_id: jobId, answers: { [key]: value } } }); await load(); });
}
async function upload(kind, file) {
  if (!file) return;
  const st = $('#st-' + kind); if (st) st.textContent = 'Uploading…';
  await guard(async () => {
    const fd = new FormData(); fd.append('job_id', jobId); fd.append('kind', kind); fd.append('file', file);
    const r = await api('/api/sales/upload-photo', { method: 'POST', body: fd });
    toast(r.photo.sharpness != null && r.photo.sharpness < 0.35 ? 'Saved, but it looks blurry' : 'Photo saved');
    await load();
  });
  if (st && st.textContent === 'Uploading…') st.textContent = 'Upload failed';
}
function photoButton(kind, label, cls) {
  const inp = h('input', { type: 'file', accept: 'image/*', capture: 'environment', 'data-kind': kind, onchange: e => upload(kind, e.target.files[0]) });
  return h('label', { class: 'btn ' + (cls || '') }, label, inp);
}
function renderPhotos() {
  const by = Object.fromEntries(detail.photos.map(p => [p.kind, p]));
  const box = $('#photos'); box.replaceChildren();
  for (const s of SLOTS) {
    const p = by[s.kind];
    const bad = detail.report.missing_items.find(m => m.field_key === 'photo.' + s.kind && m.severity === 'critical_blocker');
    const status = !p ? 'Missing' : bad ? 'Retake needed' : `${p.width_px}×${p.height_px}px · sharp ${p.sharpness != null ? Math.round(p.sharpness * 100) : '?'}%`;
    box.append(h('div', { class: 'card photo ' + (bad ? 'crit' : p ? 'ok' : ''), 'data-slot': s.kind },
      h('h3', {}, s.title), h('div', { class: 'muted' }, s.hint),
      p ? h('img', { src: p.url + '?v=' + (p.bytes || 0), alt: s.title }) : null,
      h('div', { class: 'status', id: 'st-' + s.kind }, status),
      photoButton(s.kind, p ? 'Retake photo' : 'Take / choose photo', p && !bad ? '' : 'primary')));
  }
}
function renderInputs() {
  for (const k of ['width_in', 'proj_in', 'house_h_in', 'front_h_in']) {
    const el = $('#' + k);
    if (document.activeElement !== el) el.value = detail.package[k] == null ? '' : detail.package[k];
  }
  const r = detail.report;
  $('#pitchline').textContent = r.pitch_per_foot_in == null ? 'Pitch shows up once all four numbers are in.'
    : `Roof pitch ${r.pitch_per_foot_in.toFixed(2)}" per foot (${r.pitch_deg}°). Minimum is 0.50".`;
  if (document.activeElement !== $('#cust')) $('#cust').value = detail.customer_name || '';
}
function actionCard(m) {
  const crit = m.severity === 'critical_blocker';
  let control;
  if (m.input_type === 'photo') {
    const kind = m.field_key.split('.')[1];
    control = photoButton(kind, m.title.toLowerCase().includes('blurry') || m.title.toLowerCase().includes('too small') ? 'Retake photo' : 'Take photo', 'primary');
  } else if (m.input_type === 'number') {
    const inp = h('input', { type: 'text', inputmode: 'text', placeholder: 'inches', 'aria-label': m.title });
    control = h('div', { class: 'row' }, inp, h('button', { class: 'primary', onclick: () => inp.value.trim() && answer(m.field_key, inp.value.trim()) }, 'Save'));
  } else {
    control = h('div', { class: 'row' }, m.choices.map(c => h('button', { class: c === 'no' ? '' : 'primary', 'data-choice': c, onclick: () => answer(m.field_key, c) }, NICE[c] || c)));
  }
  return h('div', { class: 'card ' + (crit ? 'crit' : 'verify'), 'data-key': m.field_key },
    h('h3', {}, (crit ? 'MUST FIX · ' : 'CHECK · ') + m.title), h('p', {}, m.instructions_for_rep), control);
}
function renderCards() {
  const box = $('#cards'); box.replaceChildren();
  const items = [...detail.report.missing_items].sort((a, b) => (a.severity === 'critical_blocker' ? 0 : 1) - (b.severity === 'critical_blocker' ? 0 : 1));
  if (!items.length) box.append(h('div', { class: 'card ok' }, h('h3', {}, 'Nothing missing'), h('p', {}, 'Everything Engineering needs is here.')));
  for (const m of items) box.append(actionCard(m));
}
function renderPill() {
  const r = detail.report, n = r.missing_items.filter(m => m.severity === 'critical_blocker').length;
  const p = $('#pill');
  p.className = 'pill ' + (n ? 'bad' : r.missing_items.length ? 'warn' : 'ok');
  p.textContent = n ? `${n} BLOCKER${n > 1 ? 'S' : ''}` : 'READY';
}
async function renderQuote() {
  const box = $('#quote'), my = ++quoteSeq, r = detail.report;
  if (!r.is_ready_for_engineering) {
    const n = r.missing_items.filter(m => m.severity === 'critical_blocker').length;
    box.replaceChildren(h('div', { class: 'card' }, h('h3', {}, 'Price locked'), h('p', {}, `Clear ${n} blocker${n > 1 ? 's' : ''} above to see the price.`)));
    return;
  }
  box.replaceChildren(h('div', { class: 'card' }, 'Pricing…'));
  let out;
  try { out = await api('/api/sales/generate-bom', { method: 'POST', body: { job_id: jobId } }); }
  catch (e) { if (my === quoteSeq) box.replaceChildren(h('div', { class: 'card crit' }, h('h3', {}, 'Could not price'), h('p', {}, e.message))); return; }
  if (my !== quoteSeq) return;
  const q = out.quote;
  box.replaceChildren(h('div', { class: 'card ok', id: 'quotecard' },
    h('div', { class: 'big', id: 'price' }, money(q.price)),
    h('div', { class: 'muted' }, `${q.pieces} pieces · material ${money(q.material_cost)} · ${q.margin_pct}% margin`),
    q.savings_from_drops > 0 ? h('p', { id: 'savings' }, h('b', {}, 'Drop savings offset: ' + money(q.savings_from_drops)),
      ` — ${q.reclaimed_ft} ft of reclaimed drops at $0 (price without drops: ${money(q.price_virgin_only)}).`) : h('p', { class: 'muted' }, 'No reclaimed drops used on this job.'),
    Object.keys(q.purchase_sticks).length ? h('p', { class: 'muted' }, `Needs ${JSON.stringify(q.purchase_sticks)} sticks ordered (${q.ready_in_days} day lead).`) : null));
}
function render() { renderPill(); renderPhotos(); renderInputs(); renderCards(); renderQuote(); }

async function switchJob(id) {
  jobId = id.trim() || newJobId();
  localStorage.setItem('extbus.job', jobId); $('#job').value = jobId;
  history.replaceState(null, '', '?job=' + encodeURIComponent(jobId));
  await guard(load);
}
$('#job').addEventListener('change', e => switchJob(e.target.value));
$('#cust').addEventListener('change', e => answer('customer_name', e.target.value));
for (const el of $$('input[data-key]')) el.addEventListener('change', () => { if (el.value.trim()) answer(el.dataset.key, el.value.trim()); });
switchJob(new URLSearchParams(location.search).get('job') || localStorage.getItem('extbus.job') || '');
</script></body></html>
